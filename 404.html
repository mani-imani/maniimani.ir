(function(){
var root=document.documentElement,G=JSON.parse(document.getElementById('gmdata').textContent),fa=G.lang==='fa';
/* theme */
var segs=[].slice.call(document.querySelectorAll('[data-t]'));
function setT(t){if(t==='system')root.removeAttribute('data-theme');else root.setAttribute('data-theme',t);
 segs.forEach(function(b){if(b.closest('.gm-seg'))b.setAttribute('aria-pressed',String(b.dataset.t===t))});try{localStorage.setItem('gm-theme',t)}catch(e){}}
segs.forEach(function(b){b.addEventListener('click',function(){setT(b.dataset.t)})});try{var s=localStorage.getItem('gm-theme');if(s)setT(s)}catch(e){}
/* copy buttons */
document.querySelectorAll('.copy').forEach(function(b){b.addEventListener('click',function(){var sp=b.querySelector('span'),lab=sp.textContent;
 function ok(){sp.textContent=G.copied;b.classList.add('done');setTimeout(function(){sp.textContent=lab;b.classList.remove('done')},1600)}
 try{navigator.clipboard.writeText(b.dataset.copy).then(ok,function(){})}catch(e){}})});
/* live "now" line from the roadmap */
var N=G.now,el=document.getElementById('now');
if(N&&el)try{var p={};new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date()).forEach(function(x){p[x.type]=parseInt(x.value,10)});
 var i=((p.year-N.start.year)*12+(p.month-N.start.month))*4+Math.min(4,Math.floor((p.day-1)/7)+1)-1;
 if(i>=0&&i<N.slots.length){var id=null;for(var k=i;k>=0;k--){if(N.slots[k].indexOf('buf:')!==0){id=N.slots[k];break}}
  if(id){var ph=N.ph[id];var n=fa?ph.num.replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[d]}):ph.num;
   el.textContent=N.fmt.replace('{num}',n).replace('{title}',ph.t).replace('{titleEn}',ph.t)}}}catch(e){}
/* command palette: / or Ctrl/Cmd+K; also the mobile menu */
var dlg=document.getElementById('pal');
if(dlg&&dlg.showModal){var q=document.getElementById('pal-q'),items=[].slice.call(dlg.querySelectorAll('.pal-i')),heads=[].slice.call(dlg.querySelectorAll('.pal-g')),
 empty=dlg.querySelector('.pal-empty'),act=-1;
 function norm(s){return s.toLowerCase().replace(/[‌\s]+/g,' ').replace(/ي/g,'ی').replace(/ك/g,'ک')}
 function vis(){return items.filter(function(x){return !x.hidden})}
 function setAct(n){var v=vis();items.forEach(function(x){x.classList.remove('on');x.removeAttribute('aria-selected')});
  if(!v.length){act=-1;return}act=(n+v.length)%v.length;v[act].classList.add('on');v[act].setAttribute('aria-selected','true');v[act].scrollIntoView({block:'nearest'})}
 function filter(){var s=norm(q.value.trim());items.forEach(function(x){x.hidden=s&&norm(x.textContent).indexOf(s)<0});
  heads.forEach(function(h){var n=h.nextElementSibling,any=false;while(n&&!n.classList.contains('pal-g')){if(!n.hidden)any=true;n=n.nextElementSibling}h.hidden=!any});
  empty.hidden=vis().length>0;setAct(0)}
 function open(){if(dlg.open)return;q.value='';filter();dlg.showModal();q.focus()}
 function close(){if(dlg.open)dlg.close()}
 document.querySelectorAll('[data-pal]').forEach(function(b){b.addEventListener('click',open)});
 dlg.querySelector('[data-close]').addEventListener('click',close);
 dlg.addEventListener('click',function(ev){if(ev.target===dlg)close();var it=ev.target.closest('.pal-i');if(it)setTimeout(close,0)});
 q.addEventListener('input',filter);
 q.addEventListener('keydown',function(ev){if(ev.key==='ArrowDown'){ev.preventDefault();setAct(act+1)}else if(ev.key==='ArrowUp'){ev.preventDefault();setAct(act-1)}
  else if(ev.key==='Enter'){var v=vis();if(v[act]){ev.preventDefault();v[act].click()}}});
 document.addEventListener('keydown',function(ev){var tg=ev.target,typing=tg&&(tg.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName));
  if((ev.key==='k'||ev.key==='K')&&(ev.metaKey||ev.ctrlKey)){ev.preventDefault();dlg.open?close():open()}
  else if(ev.key==='/'&&!typing&&!dlg.open){ev.preventDefault();open()}})}
/* case study: steps light up apps, apps light up steps */
var steps=[].slice.call(document.querySelectorAll('.step')),apps=[].slice.call(document.querySelectorAll('.app'));
if(steps.length){root.classList.add('js');var amap=document.querySelector('.amap'),flow=document.querySelector('.flow');
 function clear(){steps.concat(apps).forEach(function(x){x.setAttribute('aria-pressed','false');x.classList.remove('lit')});amap.classList.remove('focus');flow.classList.remove('focus')}
 steps.forEach(function(s){s.addEventListener('click',function(){var on=s.getAttribute('aria-pressed')==='true';clear();if(on)return;
  s.setAttribute('aria-pressed','true');var ids=s.dataset.apps.split(' ');amap.classList.add('focus');
  apps.forEach(function(a){if(ids.indexOf(a.dataset.app)>=0)a.classList.add('lit')})})});
 apps.forEach(function(a){a.addEventListener('click',function(){var on=a.getAttribute('aria-pressed')==='true';clear();if(on)return;
  a.setAttribute('aria-pressed','true');flow.classList.add('focus');amap.classList.add('focus');a.classList.add('lit');
  steps.forEach(function(s){if(s.dataset.apps.split(' ').indexOf(a.dataset.app)>=0)s.classList.add('lit')})})})}
/* 404: show the missing path */
var miss=document.getElementById('miss');if(miss)miss.textContent=decodeURIComponent(location.pathname);
/* a note for whoever opens the console */
try{console.log('%c'+(fa?'گیک‌مانی':'GeekMani')+'%c ▍\n'+G.console,'font:800 18px system-ui;color:#1F3A5F','color:#2F7A55;font:800 18px system-ui')}catch(e){}
})();
</script></body></html>
